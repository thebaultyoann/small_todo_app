<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todolist</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <nav id="tabs" class="tabs" role="tablist" aria-label="Vues"></nav>
    <div class="top-actions">
      <label class="switch" title="Écrit en bleu, sur tous les onglets, les tâches à faire aujourd’hui">
        <input type="checkbox" id="hl-today">
        <span>Aujourd’hui en bleu</span>
      </label>
      <div id="new-project-slot"></div>
    </div>
  </header>

  <main>
    <div id="projects" class="projects" role="tabpanel"></div>
    <p id="empty" class="empty" hidden>Aucun projet pour l’instant. Cliquez sur « nouveau projet » pour commencer.</p>
    <div id="dashboard" class="dashboard" role="tabpanel" hidden></div>
  </main>

  <datalist id="categories"></datalist>
  <dialog id="task-dialog" class="task-dialog" aria-labelledby="td-title"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
